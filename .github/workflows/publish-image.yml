name: Publish Service Image

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Commit SHA to publish; defaults to current main
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: omnichannel-service-image-promotion
  cancel-in-progress: true

env:
  IMAGE_REPOSITORY: ghcr.io/51taichi/dclaw-omnichannel-service

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision || 'main' }}

      - name: Resolve immutable image tag
        id: release
        run: |
          set -euo pipefail
          revision=$(git rev-parse HEAD)
          echo "revision=$revision" >>"$GITHUB_OUTPUT"
          echo "image=${IMAGE_REPOSITORY}:sha-$revision" >>"$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.release.outputs.image }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.release.outputs.revision }}
            cn.deepmega.dclaw.component=omnichannel-service

      - name: Verify immutable image
        run: docker buildx imagetools inspect '${{ steps.release.outputs.image }}'

      - name: Check whether revision is still main
        id: current
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVISION: ${{ steps.release.outputs.revision }}
        run: |
          set -euo pipefail
          main_revision=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)
          if [ "$REVISION" = "$main_revision" ]; then
            echo 'promote=true' >>"$GITHUB_OUTPUT"
          else
            echo 'promote=false' >>"$GITHUB_OUTPUT"
            echo 'Immutable image published; main moved, so main tag was not advanced.'
          fi

      - name: Publish verified image as main
        if: steps.current.outputs.promote == 'true'
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE_REPOSITORY}:main" \
            '${{ steps.release.outputs.image }}'
