<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WorkTool Console</title>
    <link rel="icon" type="image/png" href="./assets/ddeer.png" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <svg class="icon-sprite" aria-hidden="true">
      <symbol id="icon-refresh" viewBox="0 0 24 24">
        <path d="M21 12a9 9 0 0 1-15.1 6.6" />
        <path d="M3 12a9 9 0 0 1 15.1-6.6" />
        <path d="M18 2v4h-4" />
        <path d="M6 22v-4h4" />
      </symbol>
      <symbol id="icon-save" viewBox="0 0 24 24">
        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z" />
        <path d="M17 21v-8H7v8" />
        <path d="M7 3v5h8" />
      </symbol>
      <symbol id="icon-reset" viewBox="0 0 24 24">
        <path d="M3 6h18" />
        <path d="M8 6V4h8v2" />
        <path d="M19 6l-1 14H6L5 6" />
        <path d="M10 11v5" />
        <path d="M14 11v5" />
      </symbol>
      <symbol id="icon-send" viewBox="0 0 24 24">
        <path d="m22 2-7 20-4-9-9-4Z" />
        <path d="M22 2 11 13" />
      </symbol>
      <symbol id="icon-eye" viewBox="0 0 24 24">
        <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z" />
        <circle cx="12" cy="12" r="3" />
      </symbol>
      <symbol id="icon-edit" viewBox="0 0 24 24">
        <path d="M12 20h9" />
        <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z" />
      </symbol>
      <symbol id="icon-link" viewBox="0 0 24 24">
        <path d="M10 13a5 5 0 0 0 7.1 0l2-2a5 5 0 0 0-7.1-7.1l-1.1 1.1" />
        <path d="M14 11a5 5 0 0 0-7.1 0l-2 2A5 5 0 0 0 12 20.1l1.1-1.1" />
      </symbol>
      <symbol id="icon-terminal" viewBox="0 0 24 24">
        <path d="m4 17 5-5-5-5" />
        <path d="M12 19h8" />
      </symbol>
      <symbol id="icon-info" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10" />
        <path d="M12 16v-4" />
        <path d="M12 8h.01" />
      </symbol>
      <symbol id="icon-users" viewBox="0 0 24 24">
        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
        <circle cx="9" cy="7" r="4" />
        <path d="M22 21v-2a4 4 0 0 0-3-3.9" />
        <path d="M16 3.1a4 4 0 0 1 0 7.8" />
      </symbol>
      <symbol id="icon-plus" viewBox="0 0 24 24">
        <path d="M12 5v14" />
        <path d="M5 12h14" />
      </symbol>
      <symbol id="icon-chevron" viewBox="0 0 24 24">
        <path d="m6 9 6 6 6-6" />
      </symbol>
    </svg>
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <img class="brand-logo" src="./assets/deepmega-dclaw-logo-cropped.png" alt="DeepMega | DClaw" />
          <div class="brand-copy">
            <h1>微信机器人管理控制台</h1>
          </div>
        </div>
        <button id="refreshButton" type="button">
          <svg class="icon" aria-hidden="true"><use href="#icon-refresh"></use></svg>
          刷新
        </button>
      </div>
    </header>

    <main class="layout console-shell">
      <aside class="panel bot-sidebar">
        <div class="section-head">
          <h2 class="module-title"><svg class="icon" aria-hidden="true"><use href="#icon-users"></use></svg>已配置 Bot</h2>
          <span id="botCount" class="muted"></span>
        </div>
        <div id="botsTable" class="bot-list"></div>
      </aside>

      <div class="workspace">
      <section class="panel auth-panel">
        <h2 class="module-title"><svg class="icon" aria-hidden="true"><use href="#icon-save"></use></svg>管理密钥</h2>
        <div class="inline-form">
          <label>
            <span class="field-label">Admin API Key</span>
            <input id="apiKeyInput" type="password" placeholder="ADMIN_API_KEY" autocomplete="off" />
          </label>
          <button id="saveKeyButton" type="button">
            <svg class="icon" aria-hidden="true"><use href="#icon-save"></use></svg>
            保存
          </button>
        </div>
      </section>

      <section id="botBindingPanel" class="panel binding-panel bot-context-panel collapsible-panel">
        <div class="section-head binding-head">
          <h2 class="module-title"><svg class="icon" aria-hidden="true"><use href="#icon-link"></use></svg>Bot 绑定</h2>
          <div class="section-actions">
            <span id="bindingState" class="binding-state">新增模式</span>
            <button class="collapse-button" data-collapse-target="botBindingPanel" type="button" aria-label="收起 Bot 绑定">
              <svg class="icon" aria-hidden="true"><use href="#icon-chevron"></use></svg>
            </button>
          </div>
        </div>
        <div class="collapsible-content">
        <form id="botForm" class="form-grid">
          <label>
            <span class="field-label">Bot ID</span>
            <input name="botId" required placeholder="WorkTool botId" />
          </label>
          <label>
            <span class="field-label">Bot 名称</span>
            <input name="botName" placeholder="A部门机器人" />
          </label>
          <label>
            <span class="field-label">Agent ID</span>
            <input name="agentId" required placeholder="例如 xzj_business_manager" />
          </label>
          <label>
            <span class="field-label">Agent 名称</span>
            <input name="agentName" placeholder="A部门客服" />
          </label>
          <label>
            <span class="field-label">DClaw Base URL</span>
            <input name="dclawBaseUrl" required placeholder="https://dclaw.deepmega.cn" />
          </label>
          <label>
            <span class="field-label">OpenAPI Public ID</span>
            <input name="dclawPublicId" required placeholder="例如 xzj_zsjl" />
          </label>
          <label class="wide">
            <span class="field-label">OpenAPI API Key</span>
            <input name="agentApiKey" type="password" placeholder="可选" autocomplete="off" />
          </label>
          <div class="actions">
            <label class="toggle action-toggle">
              <input name="enabled" type="checkbox" checked />
              启用
            </label>
            <button class="primary" type="submit">
              <svg class="icon" aria-hidden="true"><use href="#icon-save"></use></svg>
              保存绑定
            </button>
            <button id="resetFormButton" type="button">
              <svg class="icon" aria-hidden="true"><use href="#icon-reset"></use></svg>
              清空
            </button>
          </div>
        </form>
        </div>
      </section>

      <section id="debugPanel" class="panel bot-context-panel collapsible-panel">
        <div class="section-head">
          <h2 class="module-title"><svg class="icon" aria-hidden="true"><use href="#icon-terminal"></use></svg>调试自动回复</h2>
          <button class="collapse-button" data-collapse-target="debugPanel" type="button" aria-label="收起调试自动回复">
            <svg class="icon" aria-hidden="true"><use href="#icon-chevron"></use></svg>
          </button>
        </div>
        <div class="collapsible-content">
        <form id="debugReplyForm" class="form-grid compact-form">
          <label class="toggle">
            <input name="enabled" type="checkbox" />
            开启调试自动回复
          </label>
          <label>
            <span class="field-label">触发词</span>
            <input name="trigger" placeholder="ping" />
          </label>
          <label>
            <span class="field-label">回复内容</span>
            <input name="reply" placeholder="pong" />
          </label>
          <div class="actions">
            <button type="submit">
              <svg class="icon" aria-hidden="true"><use href="#icon-save"></use></svg>
              保存调试配置
            </button>
          </div>
        </form>
        </div>
      </section>

      <section id="proactivePanel" class="panel bot-context-panel collapsible-panel">
        <div class="section-head">
          <h2 class="module-title"><svg class="icon" aria-hidden="true"><use href="#icon-send"></use></svg>主动推送</h2>
          <div class="section-actions">
            <button id="refreshProactiveButton" class="secondary" type="button">
              <svg class="icon" aria-hidden="true"><use href="#icon-refresh"></use></svg>
              刷新任务
            </button>
            <button class="collapse-button" data-collapse-target="proactivePanel" type="button" aria-label="收起主动推送">
              <svg class="icon" aria-hidden="true"><use href="#icon-chevron"></use></svg>
            </button>
          </div>
        </div>
        <div class="collapsible-content">
        <form id="proactiveForm" class="form-grid">
          <label>
            <span class="field-label">Bot</span>
            <select name="botId" required></select>
          </label>
          <label>
            <span class="field-label">任务名称</span>
            <input name="title" placeholder="例如 客户资料跟进" />
          </label>
          <div class="wide target-picker">
            <div class="target-picker-head">
              <div>
                <strong>目标选择</strong>
                <span id="selectedTargetCount" class="muted">已选 0 个</span>
              </div>
              <div class="row-actions target-actions">
                <button id="loadTargetsButton" class="secondary" type="button">
                  <svg class="icon" aria-hidden="true"><use href="#icon-users"></use></svg>
                  加载目标
                </button>
                <button id="seedTargetsButton" class="secondary" type="button">
                  <svg class="icon" aria-hidden="true"><use href="#icon-plus"></use></svg>
                  添加示例
                </button>
              </div>
            </div>
            <div class="target-toolbar">
              <div class="segmented" role="tablist" aria-label="目标类型">
                <button class="active" data-target-filter="all" type="button">全部</button>
                <button data-target-filter="private" type="button">私聊</button>
                <button data-target-filter="group" type="button">群组</button>
              </div>
              <label class="target-search">
                <span class="field-label">搜索</span>
                <input id="targetSearchInput" type="search" placeholder="输入客户或群名" />
              </label>
              <div class="bulk-actions">
                <button id="selectPrivateTargetsButton" class="secondary" type="button">全选私聊</button>
                <button id="selectGroupTargetsButton" class="secondary" type="button">全选群组</button>
                <button id="clearTargetsButton" class="secondary" type="button">清空</button>
              </div>
            </div>
            <div id="selectedTargets" class="selected-targets"></div>
            <div id="targetList" class="target-list"></div>
          </div>
          <label class="wide">
            <span class="field-label">推送内容</span>
            <textarea name="content" required rows="4" placeholder="请输入要主动推送的固定文案"></textarea>
          </label>
          <div class="actions">
            <button class="primary" type="submit">
              <svg class="icon" aria-hidden="true"><use href="#icon-send"></use></svg>
              创建并发送
            </button>
          </div>
        </form>
        <div class="table-wrap proactive-table">
          <table>
            <thead>
              <tr>
                <th>任务</th>
                <th>Bot</th>
                <th>状态</th>
                <th>进度</th>
                <th>时间</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="proactiveTasksTable"></tbody>
          </table>
        </div>
        </div>
      </section>

      <section id="logsPanel" class="panel bot-context-panel collapsible-panel">
        <div class="section-head">
          <h2 class="module-title"><svg class="icon" aria-hidden="true"><use href="#icon-eye"></use></svg>运行数据</h2>
          <div class="section-actions">
          <div class="inline-form compact">
            <label>
              <span class="field-label">数据类型</span>
              <select id="logType">
                <option value="incoming-messages">收到消息</option>
                <option value="outgoing-messages">发出消息</option>
                <option value="agent-invocations">Agent 调用</option>
                <option value="command-callbacks">指令回调</option>
                <option value="conversations">会话</option>
                <option value="proactive-tasks">主动任务</option>
                <option value="proactive-targets">主动目标</option>
              </select>
            </label>
            <button id="loadLogsButton" type="button">
              <svg class="icon" aria-hidden="true"><use href="#icon-eye"></use></svg>
              查看
            </button>
          </div>
          <button class="collapse-button" data-collapse-target="logsPanel" type="button" aria-label="收起运行数据">
            <svg class="icon" aria-hidden="true"><use href="#icon-chevron"></use></svg>
          </button>
          </div>
        </div>
        <div class="collapsible-content">
        <pre id="logsOutput" class="logs"></pre>
        </div>
      </section>
      </div>
    </main>

    <div id="toast" class="toast" hidden></div>
    <script src="./app.js"></script>
  </body>
</html>
