<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>微信AI销售客服管理中台 - 管理员</title>
    <link rel="stylesheet" href="/shared/auth-shell.css" />
    <link rel="stylesheet" href="/admin/styles.css" />
  </head>
  <body>
    <svg class="icon-sprite" aria-hidden="true">
      <symbol id="admin-icon-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="3" width="7" height="7" rx="1"></rect><rect x="3" y="14" width="7" height="7" rx="1"></rect><rect x="14" y="14" width="7" height="7" rx="1"></rect></symbol>
      <symbol id="admin-icon-bot" viewBox="0 0 24 24"><rect x="4" y="7" width="16" height="12" rx="3"></rect><path d="M12 3v4M8 12h.01M16 12h.01M8 16h8"></path></symbol>
      <symbol id="admin-icon-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></symbol>
      <symbol id="admin-icon-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H2.8v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1A1.7 1.7 0 0 0 9 4.6 1.7 1.7 0 0 0 10 3V2.8h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1Z"></path></symbol>
      <symbol id="admin-icon-logout" viewBox="0 0 24 24"><path d="M10 17l5-5-5-5M15 12H3M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path></symbol>
      <symbol id="admin-icon-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"></path></symbol>
      <symbol id="admin-icon-save" viewBox="0 0 24 24"><path d="M4 4h14l2 2v14H4zM8 4v6h8V4M8 20v-6h8v6"></path></symbol>
      <symbol id="admin-icon-open" viewBox="0 0 24 24"><path d="M14 3h7v7M10 14 21 3M21 14v6a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h6"></path></symbol>
      <symbol id="admin-icon-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 15h10l1-15M10 10v7M14 10v7"></path></symbol>
    </svg>

    <div id="adminAuthRoot"></div>

    <div id="adminShell" hidden>
      <header class="admin-topbar">
        <img src="/console/assets/deepmega-dclaw-logo-cropped.png" alt="DeepMega DClaw" />
        <strong>微信AI销售客服管理中台</strong>
      </header>
      <main class="admin-page">
        <nav class="admin-tabs" aria-label="管理员功能">
          <button class="active" data-admin-tab="workspaces"><svg><use href="#admin-icon-grid"></use></svg>工作区</button>
          <button data-admin-tab="bots"><svg><use href="#admin-icon-bot"></use></svg>Bots</button>
          <button data-admin-tab="agents"><svg><use href="#admin-icon-user"></use></svg>Agents</button>
          <button data-admin-tab="settings"><svg><use href="#admin-icon-settings"></use></svg>系统设置</button>
          <button id="adminLogoutButton"><svg><use href="#admin-icon-logout"></use></svg>退出</button>
        </nav>

        <section class="admin-panel active" data-admin-panel="workspaces">
          <div class="admin-panel-head">
            <h1>工作区</h1>
            <button id="newWorkspaceButton" class="secondary"><svg><use href="#admin-icon-plus"></use></svg>新增工作区</button>
          </div>
          <div class="admin-workspace-layout">
            <aside id="workspaceList" class="admin-list"></aside>
            <div class="admin-detail">
              <form id="workspaceForm" class="admin-form">
                <input name="id" type="hidden" />
                <label><span>显示名称</span><input name="name" required /></label>
                <label><span>URL 尾巴</span><input name="slug" required placeholder="例如 sales-east" /></label>
                <label><span>上半句口令</span><input name="challengeText" required /></label>
                <label><span>下半句口令</span><input name="response" type="password" placeholder="编辑时留空则保持不变" /></label>
                <label class="toggle-line"><input name="enabled" type="checkbox" checked />启用入口</label>
                <div class="admin-actions">
                  <button class="primary" type="submit"><svg><use href="#admin-icon-save"></use></svg>保存</button>
                  <button id="openWorkspaceButton" type="button" class="secondary"><svg><use href="#admin-icon-open"></use></svg>打开工作区</button>
                  <button id="deleteWorkspaceButton" type="button" class="danger"><svg><use href="#admin-icon-trash"></use></svg>删除</button>
                </div>
              </form>
              <div class="admin-subhead">
                <h2>已分配 Bots</h2>
                <button id="assignBotsButton" class="secondary"><svg><use href="#admin-icon-plus"></use></svg>分配 Bot</button>
              </div>
              <div id="workspaceBots" class="admin-item-list"></div>
            </div>
          </div>
        </section>

        <section class="admin-panel" data-admin-panel="bots">
          <div class="admin-panel-head"><h1>Bots</h1></div>
          <form id="botForm" class="admin-form admin-inline-form">
            <label><span>Bot ID</span><input name="botId" required /></label>
            <label><span>Bot 名称</span><input name="botName" /></label>
            <label><span>Agent</span><select name="agentId" required></select></label>
            <label class="toggle-line"><input name="enabled" type="checkbox" checked />启用</label>
            <button class="primary" type="submit"><svg><use href="#admin-icon-save"></use></svg>保存 Bot</button>
          </form>
          <div class="admin-table">
            <div class="admin-table-row admin-table-head"><span>Bot</span><span>Agent</span><span id="workspaceColumn">工作区</span><span>操作</span></div>
            <div id="botList"></div>
          </div>
        </section>

        <section class="admin-panel" data-admin-panel="agents">
          <div class="admin-panel-head"><h1>Agents</h1></div>
          <form id="agentForm" class="admin-form admin-inline-form">
            <label><span>Agent ID</span><input name="agentId" required /></label>
            <label><span>Agent 名称</span><input name="agentName" /></label>
            <label><span>DClaw Base URL</span><input name="dclawBaseUrl" required /></label>
            <label><span>OpenAPI Public ID</span><input name="dclawPublicId" required /></label>
            <label><span>OpenAPI API Key</span><input name="agentApiKey" type="password" /></label>
            <label class="toggle-line"><input name="enabled" type="checkbox" checked />启用</label>
            <button class="primary" type="submit"><svg><use href="#admin-icon-save"></use></svg>保存 Agent</button>
          </form>
          <div id="agentList" class="admin-item-list"></div>
        </section>

        <section class="admin-panel" data-admin-panel="settings">
          <div class="admin-panel-head"><h1>系统设置</h1></div>
          <form id="adminPasswordForm" class="admin-form settings-form">
            <label><span>新的管理员密码</span><input name="password" type="password" required /></label>
            <label><span>再次输入</span><input name="confirmation" type="password" required /></label>
            <button class="primary" type="submit"><svg><use href="#admin-icon-save"></use></svg>修改密码</button>
          </form>
        </section>
      </main>
    </div>

    <div id="assignmentModal" class="admin-modal" hidden>
      <section class="admin-assignment-modal" role="dialog" aria-modal="true" aria-labelledby="assignmentTitle">
        <h2 id="assignmentTitle">分配 Bots</h2>
        <input id="assignmentSearch" placeholder="搜索 Bot 名称或 ID" />
        <div id="assignmentBotList" class="admin-item-list"></div>
        <div class="admin-actions">
          <button id="assignmentCancelButton" class="secondary">取消</button>
          <button id="assignmentConfirmButton" class="primary">确认分配</button>
        </div>
      </section>
    </div>
    <div id="adminToast" class="admin-toast" hidden></div>

    <script src="/shared/auth-shell.js"></script>
    <script src="/admin/app.js"></script>
  </body>
</html>
