<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>微信AI销售客服管理后台</title>
    <link rel="stylesheet" href="/shared/auth-shell.css" />
    <link rel="stylesheet" href="/admin/styles.css" />
  </head>
  <body>
    <svg class="icon-sprite" aria-hidden="true">
      <symbol id="admin-icon-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="3" width="7" height="7" rx="1"></rect><rect x="3" y="14" width="7" height="7" rx="1"></rect><rect x="14" y="14" width="7" height="7" rx="1"></rect></symbol>
      <symbol id="admin-icon-bot" viewBox="0 0 24 24"><rect x="4" y="7" width="16" height="12" rx="3"></rect><path d="M12 3v4M8 12h.01M16 12h.01M8 16h8"></path></symbol>
      <symbol id="admin-icon-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></symbol>
      <symbol id="admin-icon-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H2.8v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1A1.7 1.7 0 0 0 9 4.6 1.7 1.7 0 0 0 10 3V2.8h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1Z"></path></symbol>
      <symbol id="admin-icon-logout" viewBox="0 0 24 24"><path d="M10 17l5-5-5-5M15 12H3M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path></symbol>
      <symbol id="admin-icon-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"></path></symbol>
      <symbol id="admin-icon-save" viewBox="0 0 24 24"><path d="M4 4h14l2 2v14H4zM8 4v6h8V4M8 20v-6h8v6"></path></symbol>
      <symbol id="admin-icon-open" viewBox="0 0 24 24"><path d="M14 3h7v7M10 14 21 3M21 14v6a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h6"></path></symbol>
      <symbol id="admin-icon-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 15h10l1-15M10 10v7M14 10v7"></path></symbol>
      <symbol id="admin-icon-name" viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h16"></path></symbol>
      <symbol id="admin-icon-link" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.1.1l2-2a5 5 0 0 0-7.1-7.1l-1.1 1.1M14 11a5 5 0 0 0-7.1-.1l-2 2A5 5 0 0 0 12 20l1.1-1.1"></path></symbol>
      <symbol id="admin-icon-quote" viewBox="0 0 24 24"><path d="M9 11H5a2 2 0 0 0-2 2v4a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2V9a4 4 0 0 0-4-4M21 11h-4a2 2 0 0 0-2 2v4a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2V9a4 4 0 0 0-4-4"></path></symbol>
      <symbol id="admin-icon-power" viewBox="0 0 24 24"><path d="M12 2v10M18.4 6.6a9 9 0 1 1-12.8 0"></path></symbol>
      <symbol id="admin-icon-id" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"></rect><circle cx="8" cy="11" r="2"></circle><path d="M5.5 16a3 3 0 0 1 5 0M14 10h4M14 14h4"></path></symbol>
      <symbol id="admin-icon-key" viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"></circle><path d="m11 12 9-9M15 7l2 2M17 5l2 2"></path></symbol>
      <symbol id="admin-icon-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></symbol>
      <symbol id="admin-icon-edit" viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"></path></symbol>
      <symbol id="admin-icon-transfer" viewBox="0 0 24 24"><path d="M17 3l4 4-4 4M3 7h18M7 21l-4-4 4-4M21 17H3"></path></symbol>
      <symbol id="admin-icon-unlink" viewBox="0 0 24 24"><path d="m18.8 12.8 1.3-1.3a5 5 0 0 0-7.1-7.1l-1.2 1.2M5.2 11.2l-1.3 1.3a5 5 0 0 0 7.1 7.1l1.2-1.2M8 12h8M3 3l18 18"></path></symbol>
      <symbol id="admin-icon-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"></path></symbol>
      <symbol id="admin-icon-close" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"></path></symbol>
      <symbol id="admin-icon-login" viewBox="0 0 24 24"><path d="M10 17l5-5-5-5M15 12H3M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path></symbol>
    </svg>

    <div id="adminAuthRoot"></div>

    <div id="adminShell" hidden>
      <header class="topbar admin-topbar">
        <div class="topbar-inner">
          <div class="brand">
            <img class="brand-logo" src="/console/assets/deepmega-dclaw-logo-cropped.png" alt="DeepMega DClaw" />
            <div class="brand-copy">
              <h1>微信AI销售客服管理后台</h1>
            </div>
          </div>
          <div class="topbar-platforms" aria-label="支持平台">
            <span class="platform-logo wechat" aria-label="微信" role="img">
              <img src="/console/assets/wechat.png" alt="" />
            </span>
            <span class="platform-logo wecom" aria-label="企业微信" role="img">
              <img src="/console/assets/compay_wechat.png" alt="" />
            </span>
          </div>
        </div>
      </header>
      <main class="admin-page">
        <nav class="admin-tabs" aria-label="管理员功能">
          <button class="active" data-admin-tab="workspaces"><svg><use href="#admin-icon-grid"></use></svg>工作区</button>
          <button data-admin-tab="bots"><svg><use href="#admin-icon-bot"></use></svg>Bots</button>
          <button data-admin-tab="agents"><svg><use href="#admin-icon-user"></use></svg>Agents</button>
          <button data-admin-tab="settings"><svg><use href="#admin-icon-settings"></use></svg>系统设置</button>
          <button id="adminLogoutButton"><svg><use href="#admin-icon-logout"></use></svg>退出</button>
        </nav>

        <section class="admin-panel active" data-admin-panel="workspaces">
          <div class="admin-panel-head">
            <h1>工作区</h1>
            <button id="newWorkspaceButton" class="secondary"><svg><use href="#admin-icon-plus"></use></svg>新增工作区</button>
          </div>
          <div class="admin-workspace-layout">
            <aside id="workspaceList" class="admin-list"></aside>
            <div class="admin-detail">
              <form id="workspaceForm" class="admin-form">
                <input name="id" type="hidden" />
                <label><span><svg><use href="#admin-icon-name"></use></svg>显示名称</span><input name="name" required /></label>
                <label><span><svg><use href="#admin-icon-link"></use></svg>URL 尾巴</span><input name="slug" required placeholder="例如 sales-east" /></label>
                <label><span><svg><use href="#admin-icon-quote"></use></svg>上半句口令</span><input name="challengeText" required /></label>
                <label><span><svg><use href="#admin-icon-quote"></use></svg>下半句口令</span><input name="response" type="text" placeholder="编辑时留空则保持不变" /></label>
                <label class="toggle-line admin-switch-field switch-toggle">
                  <svg><use href="#admin-icon-power"></use></svg>
                  <span>启用入口</span>
                  <input name="enabled" type="checkbox" aria-label="启用工作区入口" checked />
                  <span class="switch-slider" aria-hidden="true"></span>
                </label>
                <div class="admin-actions">
                  <button class="primary" type="submit"><svg><use href="#admin-icon-save"></use></svg>保存</button>
                  <button id="openWorkspaceButton" type="button" class="secondary"><svg><use href="#admin-icon-open"></use></svg>打开工作区</button>
                  <button id="deleteWorkspaceButton" type="button" class="danger"><svg><use href="#admin-icon-trash"></use></svg>删除</button>
                </div>
              </form>
              <div class="admin-subhead">
                <h2>已分配 Bots</h2>
                <button id="assignBotsButton" class="secondary"><svg><use href="#admin-icon-plus"></use></svg>分配 Bot</button>
              </div>
              <div id="workspaceBots" class="admin-item-list"></div>
            </div>
          </div>
        </section>

        <section class="admin-panel" data-admin-panel="bots">
          <div class="admin-panel-head"><h1>Bots</h1></div>
          <form id="botForm" class="admin-form admin-inline-form">
            <label><span><svg><use href="#admin-icon-id"></use></svg>Bot ID</span><input name="botId" required /></label>
            <label><span><svg><use href="#admin-icon-name"></use></svg>Bot 名称</span><input name="botName" /></label>
            <label><span><svg><use href="#admin-icon-user"></use></svg>Agent</span><select name="agentId" required></select></label>
            <label class="toggle-line admin-switch-field switch-toggle">
              <svg><use href="#admin-icon-power"></use></svg>
              <span>启用 Bot</span>
              <input name="enabled" type="checkbox" aria-label="启用 Bot" checked />
              <span class="switch-slider" aria-hidden="true"></span>
            </label>
            <button class="primary" type="submit"><svg><use href="#admin-icon-save"></use></svg>保存 Bot</button>
          </form>
          <div class="admin-table">
            <div class="admin-table-row admin-table-head"><span>Bot</span><span>Agent</span><span id="workspaceColumn">工作区</span><span>操作</span></div>
            <div id="botList"></div>
          </div>
        </section>

        <section class="admin-panel" data-admin-panel="agents">
          <div class="admin-panel-head"><h1>Agents</h1></div>
          <form id="agentForm" class="admin-form admin-inline-form">
            <label><span><svg><use href="#admin-icon-id"></use></svg>Agent ID</span><input name="agentId" required /></label>
            <label><span><svg><use href="#admin-icon-name"></use></svg>Agent 名称</span><input name="agentName" /></label>
            <label><span><svg><use href="#admin-icon-link"></use></svg>DClaw Base URL</span><input name="dclawBaseUrl" required /></label>
            <label><span><svg><use href="#admin-icon-id"></use></svg>OpenAPI Public ID</span><input name="dclawPublicId" required /></label>
            <label><span><svg><use href="#admin-icon-key"></use></svg>OpenAPI API Key</span><input name="agentApiKey" type="password" /></label>
            <label class="toggle-line admin-switch-field switch-toggle">
              <svg><use href="#admin-icon-power"></use></svg>
              <span>启用 Agent</span>
              <input name="enabled" type="checkbox" aria-label="启用 Agent" checked />
              <span class="switch-slider" aria-hidden="true"></span>
            </label>
            <button class="primary" type="submit"><svg><use href="#admin-icon-save"></use></svg>保存 Agent</button>
          </form>
          <div id="agentList" class="agent-card-grid admin-agent-card-grid"></div>
        </section>

        <section class="admin-panel" data-admin-panel="settings">
          <div class="admin-panel-head"><h1>系统设置</h1></div>
          <form id="adminPasswordForm" class="admin-form settings-form">
            <label><span><svg><use href="#admin-icon-key"></use></svg>新的管理员密码</span><input name="password" type="password" required /></label>
            <label><span><svg><use href="#admin-icon-check"></use></svg>再次输入</span><input name="confirmation" type="password" required /></label>
            <button class="primary" type="submit"><svg><use href="#admin-icon-save"></use></svg>修改密码</button>
          </form>
        </section>
      </main>
    </div>

    <div id="assignmentModal" class="admin-modal" hidden>
      <section class="admin-assignment-modal" role="dialog" aria-modal="true" aria-labelledby="assignmentTitle">
        <h2 id="assignmentTitle">分配 Bots</h2>
        <label class="admin-search-field">
          <span><svg><use href="#admin-icon-search"></use></svg>搜索</span>
          <input id="assignmentSearch" placeholder="搜索 Bot 名称或 ID" />
        </label>
        <div id="assignmentBotList" class="admin-item-list"></div>
        <div class="admin-actions">
          <button id="assignmentCancelButton" class="secondary"><svg><use href="#admin-icon-close"></use></svg>取消</button>
          <button id="assignmentConfirmButton" class="primary"><svg><use href="#admin-icon-check"></use></svg>确认分配</button>
        </div>
      </section>
    </div>
    <div id="adminToast" class="admin-toast" hidden></div>

    <script src="/shared/auth-shell.js"></script>
    <script src="/admin/app.js"></script>
  </body>
</html>
